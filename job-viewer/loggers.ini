[loggers]
keys=root,flask_app

[handlers]
keys=console,file_info,file_errors

[formatters]
keys=default,detailed

[logger_root]
level=INFO
handlers=console

[logger_flask_app]
level=INFO
handlers=console,file_info,file_errors
qualname=flask.app
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=default
args=(sys.stderr,)

[handler_file_info]
class=logging.handlers.RotatingFileHandler
level=INFO
formatter=detailed
args=('logs/app_info.log', 'a', 5242880, 3)

[handler_file_errors]
class=logging.handlers.RotatingFileHandler
level=WARNING
formatter=detailed
args=('logs/app_errors.log', 'a', 10485760, 5)

[formatter_default]
format=[%(asctime)s] %(levelname)s in %(module)s: %(message)s

[formatter_detailed]
format=%(asctime)s [%(levelname)s] %(process)d-%(thread)d %(name)s:%(lineno)d - %(message)s
