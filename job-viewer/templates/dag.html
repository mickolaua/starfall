{% extends "basic_page.html" %}

{% block content %}
    <h1>Prefect Deployments</h1>
    {# Airflow (legacy): <h1>Apache Airflow DAGs</h1> #}
    <ul>
        {% for dag in dags %}
            <li>
                <a href="{{ url_for('dag_details', dag_id=dag['dag_id']) }}">{{ dag.get('name') or dag.get('dag_display_name') or dag['dag_id'] }}</a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
