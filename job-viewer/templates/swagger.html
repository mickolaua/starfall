{% extends "basic_page.html" %}

{% block styles %}
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" nonce="{{ csp_nonce() }}">

<script nonce="{{ csp_nonce() }}">
    (function () {
        var DARK_ID = "swagger-dark-theme";
        var OVERRIDE_ID = "swagger-dark-overrides";
        var DARK_URL = "https://cdn.jsdelivr.net/gh/Itz-fork/Fastapi-Swagger-UI-Dark/assets/swagger_ui_dark.min.css";
        var OVERRIDE_URL = {{ url_for('static', filename='css/swagger-dark-overrides.css')|tojson }};
        var nonce = document.currentScript.nonce;

        function isDark() {
            var attr = document.documentElement.getAttribute("data-bs-theme");
            if (attr === "dark" || attr === "light") {
                return attr === "dark";
            }
            try { return localStorage.getItem("theme") === "dark"; }
            catch (e) { return false; }
        }

        function ensureLink(id, href) {
            var link = document.getElementById(id);
            if (!link) {
                link = document.createElement("link");
                link.id = id;
                link.rel = "stylesheet";
                link.href = href;
                link.nonce = nonce;
                document.head.appendChild(link);
            }
            return link;
        }

        function removeLink(id) {
            var link = document.getElementById(id);
            if (link) {
                link.remove();
            }
        }

        function applyTheme() {
            if (isDark()) {
                ensureLink(DARK_ID, DARK_URL);
                ensureLink(OVERRIDE_ID, OVERRIDE_URL);
            } else {
                removeLink(OVERRIDE_ID);
                removeLink(DARK_ID);
            }
        }

        // Same-tab changes: the native "storage" event doesn't fire here,
        // so wrap setItem/removeItem and re-apply when the theme key changes.
        try {
            var origSet = Storage.prototype.setItem;
            var origRemove = Storage.prototype.removeItem;

            Storage.prototype.setItem = function (key, value) {
                origSet.apply(this, arguments);
                if (this === window.localStorage && key === "theme") applyTheme();
            };
            Storage.prototype.removeItem = function (key) {
                origRemove.apply(this, arguments);
                if (this === window.localStorage && key === "theme") applyTheme();
            };
        } catch (e) { /* storage unavailable */ }

        // Changes from other tabs
        window.addEventListener("storage", function (e) {
            if (e.key === "theme" || e.key === null) applyTheme();
        });

        applyTheme();
    })();
</script>
{% endblock %}

{% block content %}
<div id="swagger-ui"></div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin
    nonce="{{ csp_nonce() }}"></script>
<script nonce="{{ csp_nonce() }}">
    window.ui = SwaggerUIBundle({
        url: "/api/openapi.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        persistAuthorization: true
    });
</script>
{% endblock %}
