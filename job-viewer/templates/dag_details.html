{% extends "basic_page.html" %}

{% block content %}
<div class="container py-5" style="max-width: 1100px;">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-2">
                    <li class="breadcrumb-item"><a href="{{ url_for('admin') }}">Admin</a></li>
                    <li class="breadcrumb-item"><a href="{{ url_for('dag') }}">Prefect</a></li>
                    <li class="breadcrumb-item active text-truncate" style="max-width: 12rem;" aria-current="page">{{ dag_id }}</li>
                </ol>
            </nav>
            <h1 class="h3 mb-1">Flow runs</h1>
            <p class="text-body-secondary mb-0 font-monospace small">Deployment {{ dag_id }}</p>
        </div>
        <a href="{{ url_for('dag') }}" class="btn btn-outline-secondary btn-sm">All deployments</a>
    </div>

    {% if error %}
    <div class="alert alert-warning" role="alert">{{ error }}</div>
    {% endif %}

    <div id="dag-runs">
        {% include "dag_runs_partial.html" %}
    </div>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce() }}">
    function fetchDagRuns() {
        $.ajax({
            url: "{{ url_for('dag_details', dag_id=dag_id) }}",
            method: "GET",
            headers: { "X-Requested-With": "XMLHttpRequest" },
            success: function (data) {
                $('#dag-runs').html(data);
            },
            error: function () {
                console.error("Error fetching flow runs.");
            }
        });
    }

    setInterval(fetchDagRuns, 5000);
</script>
{% endblock %}
